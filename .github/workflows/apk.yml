name: TalkBack Agent APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (core) and debug APK
        run: ./gradlew --no-daemon :core:test :app:assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk talkback-agent-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: talkback-agent-debug-apk
          path: talkback-agent-debug.apk

      # Stable download link for the phone:
      # https://github.com/<owner>/<repo>/releases/download/talkback-agent-latest/talkback-agent-debug.apk
      - name: Publish to rolling pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: talkback-agent-latest
          name: TalkBack Agent (latest debug build)
          prerelease: true
          make_latest: false
          body: "Debug build ${{ github.run_number }} from ${{ github.ref_name }} @ ${{ github.sha }}"
          files: talkback-agent-debug.apk
