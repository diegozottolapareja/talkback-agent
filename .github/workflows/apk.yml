name: TalkBack Agent APK

on:
  push:
    branches: ["**"]
  workflow_dispatch:
    inputs:
      version:
        description: "Tag for a versioned release (e.g. v0.1.0). Leave empty for a plain build."
        required: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (core) and debug APK
        run: ./gradlew --no-daemon :core:test :app:assembleFullDebug :app:assembleNoA11yDebug :app:assembleNoQapDebug :app:assembleMinimalDebug :probe:assembleDebug --stacktrace

      - name: Rename APKs
        run: |
          cp app/build/outputs/apk/full/debug/app-full-debug.apk talkback-agent-debug.apk
          cp app/build/outputs/apk/noA11y/debug/app-noA11y-debug.apk variant-noa11y.apk
          cp app/build/outputs/apk/noQap/debug/app-noQap-debug.apk variant-noqap.apk
          cp app/build/outputs/apk/minimal/debug/app-minimal-debug.apk variant-minimal.apk
          cp probe/build/outputs/apk/debug/probe-debug.apk install-probe.apk

      - uses: actions/upload-artifact@v4
        with:
          name: talkback-agent-debug-apk
          path: |
            talkback-agent-debug.apk
            install-probe.apk
            variant-noa11y.apk
            variant-noqap.apk
            variant-minimal.apk

      # Stable download link for the phone:
      # https://github.com/<owner>/<repo>/releases/download/talkback-agent-latest/talkback-agent-debug.apk
      - name: Publish to rolling pre-release
        if: ${{ inputs.version == '' || inputs.version == null }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: talkback-agent-latest
          name: TalkBack Agent (latest debug build)
          prerelease: true
          make_latest: false
          body: "Debug build ${{ github.run_number }} from ${{ github.ref_name }} @ ${{ github.sha }}"
          files: |
            talkback-agent-debug.apk
            install-probe.apk
            variant-noa11y.apk
            variant-noqap.apk
            variant-minimal.apk

      # Versioned release, created when the workflow is run manually with a version.
      - name: Publish versioned release
        if: ${{ inputs.version != '' && inputs.version != null }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          target_commitish: ${{ github.sha }}
          name: TalkBack Agent ${{ inputs.version }}
          make_latest: true
          generate_release_notes: true
          body: |
            Debug APK (signed with the repo's debug key, so it installs over previous builds).
            Test the capture channel first (Diagnóstico tab): see README.
          files: |
            talkback-agent-debug.apk
            install-probe.apk
            variant-noa11y.apk
            variant-noqap.apk
            variant-minimal.apk
